# ============================================================
# 利用予定を、毎週月曜の朝に Dropbox から読みこむしくみ
#
# このファイルは、データ用リポジトリ（非公開）の
#   .github/workflows/attendance.yml
# に置きます。
#
# やること：
#   Dropbox の「利用記録兼シフト」の Excel を取りよせ、来週の
#   「だれが何曜日に利用するか」を data/<事業所>/attendance/ に書き出します。今週のぶんは、もう完成しているのでさわりません。
#   送迎表のアプリは、それを読んで下書きを利用予定に合わせます。
#
# 用意するもの（データ用リポジトリの Settings → Secrets and variables → Actions）：
#   DROPBOX_APP_KEY        … Dropbox で作ったアプリの App key
#   DROPBOX_REFRESH_TOKEN  … アプリの「Dropbox とつなぐ」画面（dropbox-setup.html）で出る文字
# どのファイルを読むかは data/attendance-sources.json に書きます。
# ============================================================
name: 利用予定を Dropbox から読みこむ

on:
  schedule:
    # 月曜の朝 8:15（日本時間）。GitHub は世界標準時で数えるので「日曜 23:15」と書きます。
    # GitHub の時計は数分〜十数分おくれて動くことがあるため、8:30 に間に合うよう少し早めにしています。
    - cron: '15 23 * * 0'
  # 手で動かすとき：Actions の画面で「Run workflow」を押す
  # （GAS の okosu_torikomi も、これと同じ頼みを送って動かす）
  workflow_dispatch:
    inputs:
      shirase_test:
        description: '失敗の知らせ（LINE WORKS）を試しに送る'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: soutai-attendance
  cancel-in-progress: false

jobs:
  attendance:
    runs-on: ubuntu-latest
    steps:
      - name: データを取り出す
        uses: actions/checkout@v4

      - name: アプリを取り出す（Excel を読む道具を使うため）
        uses: actions/checkout@v4
        with:
          repository: tanaka19830210-rgb/sougei-app
          path: app

      - name: Python を用意する
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Excel を読む部品を入れる
        run: pip install --quiet openpyxl

      - name: Dropbox から読んで、利用予定を書き出す
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee "$RUNNER_TEMP/attendance.log"
          import json, subprocess, sys
          sources = json.load(open('data/attendance-sources.json', encoding='utf-8'))['sources']
          failed = False
          for s in sources:
              print('==', s['facilityId'], s.get('title', ''))
              r = subprocess.run([sys.executable, 'app/tools/import_attendance.py', '--dropbox', s['dropbox'], '--out', '.', '--facility', s['facilityId'], '--only-next'])
              failed = failed or r.returncode != 0
          sys.exit(1 if failed else 0)
          PY

      # 1つの事業所で失敗しても、読めたほかの事業所のぶんは保存する（always）。
      # 失敗した事業所があれば、上のステップが赤くなるので気づける。
      - name: 変わっていたら保存する
        if: always()
        run: |
          git config user.name "soutai-attendance"
          git config user.email "soutai-attendance@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "利用予定に変わりはありませんでした"
          else
            git commit -m "利用予定を Dropbox から読みこみました"
            # アプリの保存などとぶつかったら、最新を取りこんでやりなおす
            for i in 1 2 3 4 5; do
              git push && exit 0
              echo "保存がぶつかりました。最新を取りこんでやりなおします（$i 回目）"
              sleep $((i * 3))
              git pull --rebase || exit 1
            done
            echo "保存できませんでした"; exit 1
          fi

      # どこかで失敗したら、LINE WORKS で知らせる（送り先はデータ側の data/alerts.json）
      - name: 失敗を LINE WORKS で知らせる
        if: failure()
        env:
          DATA_DIR: ${{ github.workspace }}
          LW_CLIENT_ID: ${{ secrets.LW_CLIENT_ID }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          LW_SERVICE_ACCOUNT: ${{ secrets.LW_SERVICE_ACCOUNT }}
          LW_PRIVATE_KEY: ${{ secrets.LW_PRIVATE_KEY }}
          LW_BOT_ID: ${{ secrets.LW_BOT_ID }}
          LW_CHANNEL_ID: ${{ secrets.LW_CHANNEL_ID }}
        run: |
          grep -vE "^==|書き出しました" "$RUNNER_TEMP/attendance.log" 2>/dev/null | tail -5 > "$RUNNER_TEMP/detail.txt" || true
          node app/tools/publish/send-alert.js --kind attendance --title "月曜の利用予定の取りこみ" --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --detail-file "$RUNNER_TEMP/detail.txt"

      - name: 失敗の知らせを試しに送る（手で動かして、試すを選んだときだけ）
        if: ${{ inputs.shirase_test }}
        env:
          DATA_DIR: ${{ github.workspace }}
          LW_CLIENT_ID: ${{ secrets.LW_CLIENT_ID }}
          LW_CLIENT_SECRET: ${{ secrets.LW_CLIENT_SECRET }}
          LW_SERVICE_ACCOUNT: ${{ secrets.LW_SERVICE_ACCOUNT }}
          LW_PRIVATE_KEY: ${{ secrets.LW_PRIVATE_KEY }}
          LW_BOT_ID: ${{ secrets.LW_BOT_ID }}
          LW_CHANNEL_ID: ${{ secrets.LW_CHANNEL_ID }}
        run: node app/tools/publish/send-alert.js --kind attendance --title "月曜の利用予定の取りこみ" --test
