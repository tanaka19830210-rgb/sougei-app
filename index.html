<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>送迎表</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/v2.css">
</head>
<body>

<div class="bar">
  <select id="facility" aria-label="事業所"></select>
  <button class="tb" id="prev" type="button">今週</button>
  <button class="tb" id="next" type="button">来週</button>
  <div class="week" id="weeklabel"></div>
  <span class="badge" id="modebadge"></span>
  <div class="grow"></div>
  <button class="tb" id="warn" type="button" hidden></button>
  <button class="tb ai" id="ai" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 003-3V6a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.9V21h2v-2.1A7 7 0 0019 12h-2z"/></svg>AIに伝える
  </button>
  <button class="tb" id="rules" type="button">送迎ルール</button>
  <button class="tb" id="undo" type="button" disabled>戻す</button>
  <button class="tb solid" id="save" type="button">保存する</button>
  <button class="tb" id="zout" type="button" aria-label="小さく">－</button>
  <button class="tb" id="zfit" type="button" aria-label="画面にちょうど収める">100％</button>
  <button class="tb" id="zin" type="button" aria-label="大きく">＋</button>
  <button class="tb" id="more" type="button" aria-label="その他">⋯</button>
</div>

<div class="strip hide" id="strip"></div>

<div id="stage">
  <div class="printhead" id="printhead"></div>
  <div id="board"></div>
</div>

<div id="confirm">
  <div class="body" id="confirmbody"></div>
  <div class="acts">
    <button class="btn2 go" id="accept" type="button">これでよい</button>
    <button class="btn2" id="reject" type="button">やめる</button>
  </div>
</div>

<div id="bin">ここへ持ってくると はずす</div>
<div class="shade" id="shade"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<div id="login" hidden>
  <div class="logincard">
    <h1>送迎表</h1>
    <p>事業所の Google アカウントでログインしてください。</p>
    <div id="gbutton"></div>
    <p class="loginerr" id="loginerr"></p>
    <a href="?otameshi=1">ログインせずに、見本のデータで試す</a>
  </div>
</div>

<script type="module">
  import { start } from './js/v2/main.js';
  start();
</script>
</body>
</html>
