<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送迎表作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header>
  <div class="title">
    <svg viewBox="0 0 24 24"><path d="M4 16V6a2 2 0 012-2h9a2 2 0 012 2v1h1.6a2 2 0 011.7 1l1.4 2.4c.2.3.3.7.3 1V16h-2a2.5 2.5 0 01-5 0H11a2.5 2.5 0 01-5 0H4zm2-1h.6a2.5 2.5 0 014.8 0H15V6H6v9zm11 0h1v-3.3L16.7 9H17v6z"/></svg>
    送迎表作成 <small id="facilityname">読みこみ中…</small>
  </div>
  <span class="modebadge" id="modebadge"></span>
  <div class="spacer"></div>
  <button class="btn" id="auto">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 4.6L18.5 8l-3.4 3.2.8 4.8L12 13.8 8.1 16l.8-4.8L5.5 8l4.6-1.4z"/></svg>
    この週をルールどおりに割り当て
  </button>
  <button class="btn" id="clearweek">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm-7 9v-1.5C5 16.5 8 14.5 12 14.5s7 2 7 4.5V21H5zm14.5-9.5l1.4-1.4L19.5 8.7 18 10.2l-1.4-1.4-1.4 1.4 1.4 1.4-1.4 1.4 1.4 1.4 1.4-1.4 1.4 1.4 1.4-1.4-1.4-1.4z"/></svg>
    みんな降ろす
  </button>
  <button class="btn" id="undo" disabled>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L6 7l6 6V9a6 6 0 110 12H8v2h4a8 8 0 100-16z"/></svg>
    1手戻す
  </button>
  <button class="btn solid" id="save">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h11l3 3v15H5V3zm2 2v5h8V5H7zm5 8a3 3 0 100 6 3 3 0 000-6z"/></svg>
    保存
  </button>
  <button class="btn outline" id="print">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10v4H7V3zM5 8h14a2 2 0 012 2v6h-4v5H7v-5H3v-6a2 2 0 012-2zm4 8h6v3H9v-3z"/></svg>
    印刷
  </button>
  <button class="btn outline" id="publish">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l20-9L2 3v7l14 2-14 2v7z"/></svg>
    確定して配信
  </button>
</header>

<div class="toolbar">
  <div class="weeknav">
    <button id="prevweek" aria-label="前の週">◀</button>
    <div id="weeklabel"></div>
    <button id="nextweek" aria-label="次の週">▶</button>
  </div>
  <div class="seg" id="dayseg"></div>
  <div class="seg dir" id="dirseg">
    <button data-dir="out" aria-pressed="true">迎え</button>
    <button data-dir="ret" aria-pressed="false">送り</button>
  </div>
  <div class="spacer"></div>
  <span id="status" style="font-size:14px;color:var(--sub);font-weight:500;"></span>
  <span id="savestate"></span>
</div>

<div class="banner hide" id="banner"></div>

<div class="guide" id="guide">
  <span class="step"><i>1</i>週をえらぶ</span><span class="arrow">▶</span>
  <span class="step"><i>2</i>「この週をルールどおりに割り当て」をおす</span><span class="arrow">▶</span>
  <span class="step"><i>3</i>かえたい人を指でうごかす</span><span class="arrow">▶</span>
  <span class="step"><i>4</i>「保存」をおす</span>
  <div class="spacer"></div>
  <button class="btn" id="guide-close">とじる</button>
</div>

<div class="navbar">
  <div class="navlinks">
    <label>事業所
      <select id="facilitypick" class="drvpick" aria-label="事業所をえらぶ"></select>
    </label>
    <a class="btn plain" href="masters.html">マスタ編集</a>
    <a class="btn plain" href="settings.html">設定</a>
  </div>
</div>

<div class="stage">
  <div class="pool-wrap">
    <h2>
      <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-7 2-7 4.5V21h14v-2.5c0-2.5-3-4.5-7-4.5z"/></svg>
      まだ乗っていない人
    </h2>
    <p class="note">ここから車の空席へ、指でひっぱってください。</p>
    <div class="pool" id="pool"></div>
    <div class="absent hide" id="absent"></div>
  </div>
  <div class="vans" id="vans"></div>
</div>

<section class="daynotes">
  <h2>この日のメモ（紙のいちばん下に出ます）</h2>
  <p class="note">
    引き継ぎ事項は<b style="color:#a34c7c">ピンク</b>、外部の予定は<b style="color:#3b6389">青</b>で印刷されます。
    ふつうのメモは「・」つきの文字で出ます。
  </p>
  <div class="notelist" id="notelist"></div>
  <div class="noteadd">
    <select id="notekind" aria-label="メモの種類">
      <option value="hand">引き継ぎ事項（ピンク）</option>
      <option value="ext">外部の予定（青）</option>
      <option value="plain">ふつうのメモ</option>
    </select>
    <input id="notetext" type="text" placeholder="例：谷口様 車椅子 引き渡し" aria-label="メモの文">
    <button class="btn go" id="noteadd">追加</button>
  </div>
</section>

<div id="toast"></div>
<div class="veil" id="veil"></div>

<script type="module">
  import { start } from './js/ui/assignScreen.js';
  start();
</script>
</body>
</html>
